name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: go generate (and fail on diff)
        run: |
          go generate ./...
          git diff --exit-code

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: docker build
        run: docker build -t defectdojo-mcp .
